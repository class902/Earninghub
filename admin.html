<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earning Hub Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero" style="padding-bottom:0.6rem;">
      <div class="hero__badge">Earning Hub Admin</div>
      <h1>Offer & Field Control Center</h1>
      <p>Activate, deactivate, edit categories, and manage custom rows in every offer.</p>
      <a class="admin-link" href="index.html">← Back to website</a>
    </header>

    <main class="panel">
      <aside class="sidebar">
        <h3>Offers</h3>
        <div class="switch">
          <input id="referToggle" type="checkbox" />
          <label for="referToggle">Enable Refer Feature</label>
        </div>
        <div id="offerMiniList"></div>
        <button id="newOfferBtn" class="btn">+ Add New Offer</button>
      </aside>

      <section class="main-card">
        <h3>Offer Editor</h3>
        <p class="muted">Default rows on top: Name, Email, Mobile number, UPI ID. You can add/remove more rows for each offer.</p>
        <form id="offerForm">
          <div class="row">
            <input class="input" name="title" placeholder="Offer Name" required />
            <input class="input" name="cashback" type="number" placeholder="Cashback ₹" min="1" required />
          </div>
          <div class="row">
            <select name="category" class="input">
              <option>Saving account</option>
              <option>Demat Account</option>
              <option>Credit card</option>
              <option>Other</option>
            </select>
            <input class="input" name="image" placeholder="Image URL" required />
          </div>
          <input class="input" name="destinationUrl" placeholder="Original Offer URL" required />
          <textarea class="input" name="steps" rows="4" placeholder="Steps (one per line)"></textarea>
          <textarea class="input" name="terms" rows="4" placeholder="Terms (one per line)"></textarea>
          <div class="switch">
            <input id="activeToggle" name="active" type="checkbox" checked />
            <label for="activeToggle">Offer Active</label>
          </div>

          <h4>Apply Form Rows</h4>
          <div id="fieldChips"></div>
          <div class="row">
            <input id="newFieldInput" class="input" placeholder="Add custom row (e.g. City, PAN)" />
            <button id="addFieldBtn" type="button" class="btn">Add Row</button>
          </div>

          <div class="row">
            <button type="submit" class="btn">Save Offer</button>
            <button id="deleteBtn" type="button" class="btn danger">Delete Offer</button>
          </div>
        </form>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
