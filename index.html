<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earning Hub | Premium Cashback Offers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <header class="hero">
      <div class="hero__badge">Earning Hub</div>
      <h1>Premium Cashback Offers</h1>
      <p>Smart offers, easy rewards, and complete admin control.</p>
      <a class="admin-link" href="admin.html">Open Admin Panel</a>
    </header>

    <main class="container">
      <section class="categories" id="categories"></section>
      <section class="offers" id="offerList"></section>
    </main>

    <dialog id="offerDialog" class="offer-dialog">
      <form method="dialog" class="dialog-shell">
        <button type="submit" class="close-btn">✕</button>
      </form>
      <div id="offerDetail"></div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
